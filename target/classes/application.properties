spring.application.name=amaris-knowledge-center
server.port=8080

# Base de datos H2 en memoria gestionada por R2DBC
spring.r2dbc.url=r2dbc:h2:mem:///knowledgecenter;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.r2dbc.username=sa
spring.r2dbc.password=

# Inicialización del esquema y datos de ejemplo
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Consola web de H2 (accesible desde un navegador JDBC)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS para el frontend de Angular
spring.webflux.cors.allowed-origin-patterns=http://localhost:4200,http://127.0.0.1:4200
server.error.include-message=always